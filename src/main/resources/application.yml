server:
  port: ${app.port:8080}
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json
    min-response-size: 2048

spring:
  application:
    name: k12-english
  # 说明：SQLite 的 DataSource 在 DataSourceConfig 里以 @Bean 提供，
  # Spring Boot 的自动配置检测到已有 DataSource 会自动让路，无需显式 exclude。
  sql:
    init:
      # SQLite 对 Boot 来说不算「嵌入式数据库」，默认不会执行 schema.sql，
      # 必须显式设为 always。脚本里全是 CREATE TABLE IF NOT EXISTS，重复执行安全。
      mode: always
      schema-locations: classpath:schema.sql
  web:
    resources:
      # 前端产物在 jar 内的 static/ 下，交给默认资源链处理
      chain:
        compressed: true
      # 这里把 Spring Boot 的默认位置原样列出来，只在最后追加一个源码目录。
      # 为什么要追加：从 IDEA 直接 Run 时，IDEA 只编译 Java 并复制 src/main/resources，
      # **不会**跑 Maven 的 process-resources，所以 classpath:static/ 是空的，首页会 404。
      # 追加 file:frontend/dist/ 后，从 IDEA 跑也能看到完整界面。
      # classpath:/static/ 排在最前，所以打包好的 jar 行为完全不变。
      static-locations:
        - classpath:/META-INF/resources/
        - classpath:/resources/
        - classpath:/static/
        - classpath:/public/
        - file:frontend/dist/
  jackson:
    default-property-inclusion: non_null

app:
  data-dir: ${user.home}/.k12-english
  port: 8080
  open-browser: true

logging:
  level:
    root: INFO
    com.k12english: INFO
