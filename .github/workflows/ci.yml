name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端（Java 17）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 一步同时验证两件事：49 个 Java 测试全绿，以及「没有 frontend/dist 时
      # with-frontend profile 不激活也能打包成功」这条条件激活路径没坏。
      # 注意：这里产出的 jar 里**没有界面**，真正可用的 jar 由下面的 e2e job 产出并上传。
      - name: 跑测试并打包（不含前端界面）
        run: ./mvnw -B -ntp package

  frontend:
    name: 前端（Node 22）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 装依赖
        run: npm ci

      - name: 类型检查 + 构建
        run: npm run build

      - name: 冒烟测试（词库质量 + FSRS）
        run: node smoke.mjs

  e2e:
    name: 端到端（接口 + 前后端契约）
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 装前端依赖
        run: npm ci
        working-directory: frontend

      - name: 构建前端产物（供 Maven 打进 jar）
        run: npm run build
        working-directory: frontend

      - name: 构建 jar
        run: ./mvnw -B -ntp package

      - name: 启动服务
        run: |
          java -jar target/k12-english.jar \
            --server.port=8099 \
            --app.open-browser=false \
            --app.data-dir="$RUNNER_TEMP/k12-e2e" \
            > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8099/api/meta >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8099/api/meta || { cat "$RUNNER_TEMP/app.log"; exit 1; }

      - name: 后端接口冒烟
        run: bash scripts/smoke-api.sh http://127.0.0.1:8099

      - name: 前后端契约冒烟
        run: node smoke-api.mjs http://127.0.0.1:8099
        working-directory: frontend

      # 这个 jar 里前端界面、词库、6877 个发音 mp3 都在，是可以直接 `java -jar` 跑的成品。
      - name: 上传完整 jar（含前端界面）
        uses: actions/upload-artifact@v4
        with:
          name: k12-english-jar
          path: target/k12-english.jar
          retention-days: 7

      - name: 失败时输出服务日志
        if: failure()
        run: cat "$RUNNER_TEMP/app.log"
